<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xadrez Web - Torneio & Modo Computador IA</title>
    <!-- CSS do Tabuleiro -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            min-height: 100vh;
        }

        h1 { 
            margin-top: 2px;
            margin-bottom: 10px; 
            font-size: 20px;
            text-align: center;
        }

        .controls {
            background: #2b2d42;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
        }

        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
            background: #3d405b;
            padding: 4px 8px;
            border-radius: 6px;
            width: 100%;
        }

        .control-group input {
            flex: 1;
            min-width: 0;
        }

        .control-group button {
            flex: 1;
            white-space: nowrap;
        }

        button, input, select {
            padding: 8px 10px;
            border-radius: 5px;
            border: none;
            font-size: 13px;
        }

        button {
            background-color: #4caf50;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #45a049; }
        .btn-alt { background-color: #008cba; }
        .btn-alt:hover { background-color: #007bA7; }
        .btn-cpu { background-color: #9c27b0; color: #fff; }
        .btn-cpu:hover { background-color: #7b1fa2; }
        .btn-tournament { background-color: #f77f00; color: #fff; }
        .btn-tournament:hover { background-color: #d66800; }
        .btn-danger { background-color: #e63946; }
        .btn-danger:hover { background-color: #d62828; }
        button:disabled { background-color: #555 !important; cursor: not-allowed; }

        input, select { background: #fff; color: #333; outline: none; }
        .nick-input { border: 2px solid #4caf50; font-weight: bold; }

        #roomDisplay {
            background: #3d405b;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: monospace;
            display: none;
            text-align: center;
            border: 2px dashed #e0e1dd;
            width: 100%;
            max-width: 800px;
            word-break: break-all;
            font-size: 13px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1100px;
            width: 100%;
        }

        .board-wrapper {
            width: 100%;
            max-width: min(450px, 88vw);
            margin: 0 auto;
            touch-action: none !important;
        }

        /* PREVENÇÃO DE ROLAGEM DA TELA AO ARRASTAR AS PEÇAS */
        #board, #board * {
            touch-action: none !important;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #board {
            width: 100% !important;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 340px;
            max-width: 100%;
        }

        .panel {
            background: #2b2d42;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: #3d405b;
            padding: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            border-bottom: 1px solid #4a4e69;
        }

        #userList, #bracketDisplay, #scoreTableContainer {
            padding: 8px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-badge, .bracket-match {
            background: #3d405b;
            padding: 6px 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bracket-match.active {
            border: 2px solid #f77f00;
            background: #4a4e69;
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        .score-table th, .score-table td {
            padding: 5px 3px;
            border-bottom: 1px solid #3d405b;
        }

        .score-table th { background: #3d405b; color: #e0e1dd; }
        .score-table td.pts { font-weight: bold; color: #f77f00; }

        .user-role {
            font-weight: bold;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .role-w { background: #e0e1dd; color: #1e1e24; }
        .role-b { background: #1e1e24; color: #fff; border: 1px solid #fff; }
        .role-spec { background: #8d99ae; color: #1e1e24; }

        .chat-container { height: 200px; }

        .chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-msg {
            background: #3d405b;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            word-wrap: break-word;
        }

        .chat-msg.system {
            background: #8d99ae;
            color: #1e1e24;
            font-style: italic;
            text-align: center;
        }

        .chat-msg.me { background: #007bA7; align-self: flex-end; }

        .chat-input-area {
            display: flex;
            padding: 6px;
            background: #1e1e24;
            gap: 6px;
        }

        .chat-input-area input { flex: 1; min-width: 0; }

        #status {
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            background: #2b2d42;
            padding: 8px;
            border-radius: 5px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            body { padding: 4px; }
            h1 { font-size: 18px; margin-bottom: 8px; }
            
            .controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                padding: 8px;
            }

            #nickInput {
                grid-column: span 2;
                width: 100%;
            }

            .control-group {
                grid-column: span 2;
                display: flex;
                width: 100%;
                gap: 6px;
            }

            .control-group input {
                flex: 1;
                min-width: 0;
                width: 50%;
            }

            .control-group button {
                flex: 1;
                width: 50%;
            }

            .control-group select {
                flex: 1;
            }

            button {
                width: 100%;
                font-size: 12px;
                padding: 8px 4px;
            }

            .board-wrapper {
                max-width: min(85vw, 360px);
            }

            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>Xadrez Web</h1>

    <div class="controls">
        <input type="text" id="nickInput" class="nick-input" placeholder="Seu Nickname" value="Jogador">
        
        <div class="control-group">
            <label for="colorSelect" style="font-size: 12px; font-weight: bold; white-space: nowrap;">Cor:</label>
            <select id="colorSelect" style="width: 100%;">
                <option value="w">♔ Brancas</option>
                <option value="b">♚ Pretas</option>
                <option value="random">🎲 Aleatória</option>
            </select>
        </div>

        <button onclick="startOffline('local')">Offline Local</button>
        <button class="btn-cpu" onclick="startOffline('cpu')">🤖 vs IA</button>
        
        <div class="control-group">
            <input type="text" id="createRoomIdInput" placeholder="Código Criar">
            <button class="btn-alt" onclick="createOnlineRoom()">Criar Sala</button>
        </div>

        <div class="control-group">
            <input type="text" id="joinRoomIdInput" placeholder="Código Entrar">
            <button class="btn-alt" onclick="joinOnlineRoom()">Entrar</button>
        </div>

        <button id="startTournamentBtn" class="btn-tournament" onclick="startTournament()" style="display:none; grid-column: span 2;">🏆 Iniciar Torneio</button>
        <button id="resignBtn" class="btn-danger" onclick="resignGame()" disabled style="grid-column: span 2;">Desistir</button>
    </div>

    <div id="roomDisplay"></div>

    <div class="main-container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>

        <div class="sidebar">
            <div class="panel" id="scorePanel" style="display: none;">
                <div class="panel-header">📊 Tabela de Pontuação</div>
                <div id="scoreTableContainer">
                    <table class="score-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th style="text-align: left;">Jogador</th>
                                <th>V</th>
                                <th>E</th>
                                <th>D</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody id="scoreTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="panel" id="tournamentPanel" style="display: none;">
                <div class="panel-header">🏆 Chaveamento do Torneio</div>
                <div id="bracketDisplay">
                    <div style="text-align: center; color: #8d99ae;">Aguardando início...</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header" id="userCountHeader">Pessoas na Sala (0/20)</div>
                <div id="userList">
                    <div style="text-align: center; color: #8d99ae;">Nenhuma sala ativa.</div>
                </div>
            </div>

            <div class="panel chat-container">
                <div class="panel-header">Bate-Papo da Sala</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-msg system">Entre numa sala para conversar.</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Digite uma mensagem..." disabled onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button id="chatBtn" onclick="sendChatMessage()" disabled>Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status">Iniciando...</div>

    <!-- Bibliotecas CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // Web Audio API
        let audioCtx = null;

        function tocarSomMovimento() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        let board = null;
        let game = new Chess();
        let peer = null;
        let isHost = false;
        let hostConn = null;
        
        let activeWhite = null;
        let activeBlack = null;
        let spectatorQueue = [];
        let userNicks = {};
        let connections = {};

        // Modo Offline / CPU
        let isCpuMode = false;
        let playerColor = 'w';

        // Sistema de Pontuação e Torneio
        let scores = {};
        let tournamentActive = false;
        let tournamentData = null;

        let myPeerId = 'HOST';
        let myNick = 'Jogador';
        let myRole = 'offline';
        let mode = 'offline';

        const MAX_USERS = 20;

        const cpuDialogues = {
            start: [
                "Que comece o jogo! Boa sorte humano.",
                "Processando estratégias... Que vença o melhor!",
                "Estou pronto! Mostre-me suas melhores jogadas."
            ],
            check: [
                "Xeque! Cuidado com o seu Rei.",
                "Seu Rei está sob ameaça!",
                "Sinta a pressão! Xeque no tabuleiro."
            ],
            capture: [
                "Obrigado por essa peça!",
                "Uma troca interessante... para mim!",
                "Menos uma peça no seu exército!"
            ],
            chatResponses: [
                "Estou analisando milhares de posições por segundo, mas posso conversar também!",
                "Interessante observação... agora veja este movimento!",
                "Focar no jogo é crucial para não perder uma peça!",
                "Zero e um... um e zero... Ops, desculpe, me distraí conversando!",
                "Boa tentativa de me distrair com papo furado!"
            ],
            win: [
                "Xeque-mate! As máquinas prevalecem desta vez.",
                "Excelente partida! Quer tentar uma revanche?"
            ],
            loss: [
                "Parabéns! Suas táticas foram superiores.",
                "Erro nos meus circuitos! Você jogou muito bem."
            ]
        };

        function cpuSpeak(category, delay = 600) {
            if (!isCpuMode) return;
            let list = cpuDialogues[category];
            if (!list || list.length === 0) return;
            let msg = list[Math.floor(Math.random() * list.length)];
            setTimeout(() => {
                addChatMessage('🤖 IA', msg);
            }, delay);
        }

        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 1000 };

        const pst = {
            p: [
                [0,  0,  0,  0,  0,  0,  0,  0],
                [50, 50, 50, 50, 50, 50, 50, 50],
                [10, 10, 20, 30, 30, 20, 10, 10],
                [ 5,  5, 10, 25, 25, 10,  5,  5],
                [ 0,  0,  0, 20, 20,  0,  0,  0],
                [ 5, -5,-10,  0,  0,-10, -5,  5],
                [ 5, 10, 10,-20,-20, 10, 10,  5],
                [ 0,  0,  0,  0,  0,  0,  0,  0]
            ],
            n: [
                [-50,-40,-30,-30,-30,-30,-40,-50],
                [-40,-20,  0,  0,  0,  0,-20,-40],
                [-30,  0, 10, 15, 15, 10,  0,-30],
                [-30,  5, 15, 20, 20, 15,  5,-30],
                [-30,  0, 15, 20, 20, 15,  0,-30],
                [-30,  5, 10, 15, 15, 10,  5,-30],
                [-40,-20,  0,  5,  5,  0,-20,-40],
                [-50,-40,-30,-30,-30,-30,-40,-50]
            ]
        };

        function getNick() {
            let input = document.getElementById('nickInput').value.trim();
            return input ? input : 'Jogador';
        }

        function sanitizeRoomCode(code) {
            return code.replace(/[^a-zA-Z0-9_-]/g, '');
        }

        function onDragStart (source, piece) {
            if (game.game_over()) return false;

            if (mode === 'offline') {
                if (isCpuMode) {
                    if (game.turn() !== playerColor) return false;
                    if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                        (playerColor === 'b' && piece.search(/^w/) !== -1)) return false;
                } else {
                    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                        (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
                }
            } else {
                if (myRole !== 'w' && myRole !== 'b') return false;
                if (game.turn() !== myRole) return false;
                if ((myRole === 'w' && piece.search(/^b/) !== -1) ||
                    (myRole === 'b' && piece.search(/^w/) !== -1)) return false;
            }
        }

        function onDrop (source, target) {
            let move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            tocarSomMovimento();
            updateStatus();

            if (mode === 'online') {
                let payload = { type: 'move', move: move, fen: game.fen() };
                if (isHost) handleGameMove(myPeerId, move);
                else if (hostConn) hostConn.send(payload);
            } else if (isCpuMode && !game.game_over()) {
                window.setTimeout(makeCpuMove, 300);
            }
        }

        function evaluateBoard(boardState) {
            let totalEval = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let piece = boardState[r][c];
                    if (piece) {
                        let val = pieceValues[piece.type] || 0;
                        let posVal = 0;
                        
                        if (pst[piece.type]) {
                            posVal = piece.color === 'w' ? pst[piece.type][r][c] : pst[piece.type][7 - r][c];
                        }

                        let score = val + posVal;
                        totalEval += (piece.color === 'w') ? score : -score;
                    }
                }
            }
            return totalEval;
        }

        function minimax(depth, isMaximizing, alpha, beta) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            let moves = game.moves({ verbose: true });

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evaluation = minimax(depth - 1, false, alpha, beta);
                    game.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evaluation = minimax(depth - 1, true, alpha, beta);
                    game.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeCpuMove() {
            if (game.game_over()) return;

            let moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let bestMove = null;
            let isMaximizing = (playerColor === 'b');
            let bestValue = isMaximizing ? -Infinity : Infinity;
            let depth = 3;

            moves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0));

            for (let move of moves) {
                game.move(move);
                let boardVal = minimax(depth - 1, !isMaximizing, -Infinity, Infinity);
                game.undo();

                if (isMaximizing) {
                    if (boardVal > bestValue) {
                        bestValue = boardVal;
                        bestMove = move;
                    }
                } else {
                    if (boardVal < bestValue) {
                        bestValue = boardVal;
                        bestMove = move;
                    }
                }
            }

            if (bestMove) {
                game.move(bestMove);
                board.position(game.fen());
                updateStatus();
                tocarSomMovimento();

                if (game.in_checkmate()) {
                    cpuSpeak('win');
                } else if (game.in_check()) {
                    cpuSpeak('check');
                } else if (bestMove.captured && Math.random() < 0.4) {
                    cpuSpeak('capture');
                }
            }
        }

        function onSnapEnd () { board.position(game.fen()); }

        function updateStatus () {
            let status = '';
            let moveColorName = (game.turn() === 'w') ? 'Brancas' : 'Pretas';

            if (game.in_checkmate()) {
                let winnerColor = game.turn() === 'w' ? 'Pretas' : 'Brancas';
                status = `Xeque-mate! ${winnerColor} venceram!`;
            } else if (game.in_draw()) {
                status = 'Fim de jogo: Empate.';
            } else {
                if (mode === 'online') {
                    if (myRole === 'spectator') {
                        status = `Modo Espectador | Vez das ${moveColorName}`;
                    } else {
                        let isMyTurn = (game.turn() === myRole);
                        status = isMyTurn ? `Sua vez!` : `Aguardando jogada do oponente...`;
                    }
                } else if (isCpuMode) {
                    let isCpuTurn = game.turn() !== playerColor;
                    status = isCpuTurn ? `🤖 Computador pensando...` : `Sua vez (${moveColorName})!`;
                } else {
                    status = 'Vez das ' + moveColorName;
                }
                if (game.in_check()) status += ' (Em Xeque!)';
            }
            document.getElementById('status').innerText = status;
        }

        function initBoard(orientation = 'white') {
            let config = {
                draggable: true,
                position: game.fen(),
                orientation: orientation,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);
            updateStatus();
            setTimeout(resizeBoard, 200);

            // Bloquear a rolagem nativa da página ao tocar no tabuleiro
            const boardEl = document.getElementById('board');
            if (boardEl) {
                boardEl.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });
            }
        }

        function resizeBoard() {
            if (board) {
                board.resize();
            }
        }

        $(window).on('resize orientationchange', function() {
            setTimeout(resizeBoard, 100);
        });

        function setControlsState(inOnlineGame) {
            let enableChat = inOnlineGame || isCpuMode;
            document.getElementById('chatInput').disabled = !enableChat;
            document.getElementById('chatBtn').disabled = !enableChat;
            document.getElementById('resignBtn').disabled = !inOnlineGame || (myRole !== 'w' && myRole !== 'b');
            document.getElementById('startTournamentBtn').style.display = (isHost && inOnlineGame) ? 'block' : 'none';
            document.getElementById('scorePanel').style.display = inOnlineGame ? 'flex' : 'none';
            document.getElementById('tournamentPanel').style.display = tournamentActive ? 'flex' : 'none';
        }

        function addChatMessage(sender, text, type = '') {
            let chatMessages = document.getElementById('chatMessages');
            let msgEl = document.createElement('div');
            msgEl.className = `chat-msg ${type}`;
            msgEl.innerHTML = type === 'system' ? text : `<strong>${escapeHtml(sender)}:</strong> ${escapeHtml(text)}`;
            chatMessages.appendChild(msgEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendChatMessage() {
            let input = document.getElementById('chatInput');
            let text = input.value.trim();
            if (!text) return;

            let myCurrentNick = getNick();

            if (isCpuMode) {
                addChatMessage(myCurrentNick, text, 'me');
                input.value = '';
                cpuSpeak('chatResponses', 1000);
                return;
            }

            let payload = { type: 'chat', nick: myCurrentNick, text: text };
            if (mode === 'online') {
                if (isHost) { addChatMessage(myCurrentNick, text, 'me'); broadcast(payload); }
                else if (hostConn) { addChatMessage(myCurrentNick, text, 'me'); hostConn.send(payload); }
            }
            input.value = '';
        }

        function resignGame() {
            if (mode !== 'online' || (myRole !== 'w' && myRole !== 'b')) return;
            if (confirm('Deseja desistir da partida?')) {
                let loserRole = myRole;
                if (isHost) handleResignation(loserRole);
                else if (hostConn) hostConn.send({ type: 'resign', role: loserRole });
            }
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        function renderUserList(users) {
            let userListEl = document.getElementById('userList');
            userListEl.innerHTML = '';
            document.getElementById('userCountHeader').innerText = `Pessoas na Sala (${users.length}/${MAX_USERS})`;

            users.forEach(u => {
                let badgeClass = 'role-spec';
                let roleText = u.role === 'w' ? 'Brancas' : (u.role === 'b' ? 'Pretas' : `Fila #${u.queuePos}`);
                if (u.role === 'w') badgeClass = 'role-w';
                else if (u.role === 'b') badgeClass = 'role-b';

                let div = document.createElement('div');
                div.className = 'user-badge';
                div.innerHTML = `<span>${escapeHtml(u.nick)}</span> <span class="user-role ${badgeClass}">${roleText}</span>`;
                userListEl.appendChild(div);
            });
        }

        function renderScoreTable() {
            let tbody = document.getElementById('scoreTableBody');
            tbody.innerHTML = '';

            let sorted = Object.keys(scores).map(id => ({
                id: id,
                nick: userNicks[id] || 'Jogador',
                ...scores[id]
            })).sort((a, b) => b.pts - a.pts || b.v - a.v);

            if (sorted.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="color: #8d99ae;">Nenhuma partida jogada.</td></tr>';
                return;
            }

            sorted.forEach((item, idx) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td style="text-align: left; font-weight: bold;">${escapeHtml(item.nick)}</td>
                    <td>${item.v}</td>
                    <td>${item.e}</td>
                    <td>${item.d}</td>
                    <td class="pts">${item.pts.toFixed(1)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderBracketDisplay() {
            let container = document.getElementById('bracketDisplay');
            if (!tournamentActive || !tournamentData) {
                container.innerHTML = '<div style="text-align: center; color: #8d99ae;">Nenhum torneio em andamento.</div>';
                return;
            }

            container.innerHTML = '';
            let rIdx = tournamentData.currentRound;
            let roundMatches = tournamentData.rounds[rIdx];

            let roundNames = ['Final', 'Semifinal', 'Quartas de Final', 'Oitavas de Final'];
            let roundName = roundNames[tournamentData.rounds.length - 1 - rIdx] || `Rodada ${rIdx + 1}`;

            let titleDiv = document.createElement('div');
            titleDiv.style.fontWeight = 'bold';
            titleDiv.style.textAlign = 'center';
            titleDiv.innerText = `Fase: ${roundName}`;
            container.appendChild(titleDiv);

            roundMatches.forEach((m, mIdx) => {
                let p1Name = userNicks[m.p1] || (m.p1 === 'BYE' ? 'BYE (Avança)' : 'A definir');
                let p2Name = userNicks[m.p2] || (m.p2 === 'BYE' ? 'BYE (Avança)' : 'A definir');
                let isCurrent = (mIdx === tournamentData.currentMatch);

                let div = document.createElement('div');
                div.className = `bracket-match ${isCurrent ? 'active' : ''}`;
                let statusTxt = m.winner ? `🏆 ${userNicks[m.winner] || m.winner}` : (isCurrent ? '⚡ Em Jogo' : 'Aguardando');
                div.innerHTML = `<div><strong>${escapeHtml(p1Name)}</strong> vs <strong>${escapeHtml(p2Name)}</strong></div><small>${statusTxt}</small>`;
                container.appendChild(div);
            });
        }

        function broadcast(data, exceptId = null) {
            Object.keys(connections).forEach(id => {
                if (id !== exceptId && connections[id] && connections[id].open) {
                    connections[id].send(data);
                }
            });
        }

        function initPlayerScore(id) {
            if (!scores[id]) {
                scores[id] = { v: 0, e: 0, d: 0, pts: 0 };
            }
        }

        function getRoomUserList() {
            let list = [];
            if (activeWhite) list.push({ nick: userNicks[activeWhite], role: 'w', queuePos: 0 });
            if (activeBlack) list.push({ nick: userNicks[activeBlack], role: 'b', queuePos: 0 });
            spectatorQueue.forEach((id, idx) => {
                list.push({ nick: userNicks[id], role: 'spectator', queuePos: idx + 1 });
            });
            return list;
        }

        function resetPeer() {
            if (peer) { peer.destroy(); peer = null; }
            connections = {};
            userNicks = {};
            spectatorQueue = [];
            activeWhite = null;
            activeBlack = null;
            hostConn = null;
            tournamentActive = false;
            tournamentData = null;
            scores = {};
        }

        function startOffline(submode = 'local') {
            mode = 'offline';
            myRole = 'offline';
            isCpuMode = (submode === 'cpu');

            let selectedColor = document.getElementById('colorSelect').value;
            if (selectedColor === 'random') {
                playerColor = Math.random() < 0.5 ? 'w' : 'b';
            } else {
                playerColor = selectedColor;
            }

            resetPeer();
            
            document.getElementById('roomDisplay').style.display = 'none';
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('userList').innerHTML = `<div style="text-align: center; color: #8d99ae;">Modo Offline (${isCpuMode ? 'vs IA' : 'Local'}).</div>`;
            document.getElementById('userCountHeader').innerText = 'Pessoas na Sala (0/20)';
            
            let colorName = playerColor === 'w' ? 'Brancas ♔' : 'Pretas ♚';
            addChatMessage('', isCpuMode ? `🤖 Modo Contra IA ativado! Você joga de ${colorName}.` : 'Modo Offline (2 Jogadores Local)', 'system');
            
            setControlsState(false);
            game.reset();

            let boardOrientation = (isCpuMode && playerColor === 'b') ? 'black' : 'white';
            initBoard(boardOrientation);

            if (isCpuMode) {
                cpuSpeak('start', 800);
                if (playerColor === 'b') {
                    window.setTimeout(makeCpuMove, 1200);
                }
            }
        }

        function createOnlineRoom() {
            mode = 'online';
            isCpuMode = false;
            isHost = true;
            myNick = getNick();
            game.reset();
            resetPeer();

            let customCode = sanitizeRoomCode(document.getElementById('createRoomIdInput').value.trim());
            document.getElementById('chatMessages').innerHTML = '';
            setControlsState(true);

            peer = customCode ? new Peer(customCode) : new Peer();

            peer.on('open', (id) => {
                myPeerId = id;
                activeWhite = myPeerId;
                userNicks[myPeerId] = myNick;
                initPlayerScore(myPeerId);
                myRole = 'w';

                let display = document.getElementById('roomDisplay');
                display.style.display = 'block';
                display.innerHTML = `⏳ <strong>SALA (${escapeHtml(myNick)})</strong> | Código: <mark>${id}</mark>`;
                
                updateRoomState();
                initBoard('white');
                addChatMessage('', `Sala criada por ${myNick}. Aguardando jogadores...`, 'system');
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') { alert('Código de sala já em uso!'); startOffline('local'); }
                else alert('Erro: ' + err.message);
            });

            peer.on('connection', (c) => {
                if (Object.keys(connections).length >= MAX_USERS - 1) {
                    c.on('open', () => { c.send({ type: 'error', text: 'Sala cheia!' }); setTimeout(() => c.close(), 500); });
                    return;
                }
                c.on('data', (data) => handleHostReceivedData(c, data));
                c.on('close', () => handleUserDisconnect(c.peer));
            });
        }

        function startTournament() {
            if (!isHost) return;

            let players = [myPeerId, ...Object.keys(connections)];
            if (players.length < 2) {
                alert('É necessário ter no mínimo 2 jogadores na sala para iniciar o torneio!');
                return;
            }

            if (!confirm(`Iniciar torneio mata-mata com ${players.length} participantes?`)) return;

            players.sort(() => Math.random() - 0.5);

            let pow = 2;
            while (pow < players.length) pow *= 2;

            let roundsCount = Math.log2(pow);
            let rounds = [];

            let r1 = [];
            for (let i = 0; i < pow; i += 2) {
                let p1 = players[i] || 'BYE';
                let p2 = players[i+1] || 'BYE';
                r1.push({ p1: p1, p2: p2, winner: null });
            }
            rounds.push(r1);

            for (let r = 1; r < roundsCount; r++) {
                let matchCount = pow / Math.pow(2, r + 1);
                let roundMatches = [];
                for (let m = 0; m < matchCount; m++) {
                    roundMatches.push({ p1: null, p2: null, winner: null });
                }
                rounds.push(roundMatches);
            }

            tournamentActive = true;
            tournamentData = {
                rounds: rounds,
                currentRound: 0,
                currentMatch: 0
            };

            processByes();
            setupNextTournamentMatch();
            addChatMessage('', '🏆 TORNEIO INICIADO! Boa sorte a todos!', 'system');
        }

        function processByes() {
            let round = tournamentData.rounds[tournamentData.currentRound];
            for (let mIdx = 0; mIdx < round.length; mIdx++) {
                let m = round[mIdx];
                if (m.p1 === 'BYE' && m.p2 !== 'BYE') {
                    advanceTournamentWinner(mIdx, m.p2);
                } else if (m.p2 === 'BYE' && m.p1 !== 'BYE') {
                    advanceTournamentWinner(mIdx, m.p1);
                }
            }
        }

        function setupNextTournamentMatch() {
            let rIdx = tournamentData.currentRound;
            let round = tournamentData.rounds[rIdx];

            while (tournamentData.currentMatch < round.length && round[tournamentData.currentMatch].winner) {
                tournamentData.currentMatch++;
            }

            if (tournamentData.currentMatch >= round.length) {
                if (rIdx + 1 < tournamentData.rounds.length) {
                    tournamentData.currentRound++;
                    tournamentData.currentMatch = 0;
                    processByes();
                    setupNextTournamentMatch();
                    return;
                } else {
                    let championId = tournamentData.rounds[rIdx][0].winner;
                    let championNick = userNicks[championId] || 'Campeão';
                    addChatMessage('', `🎉 TORNEIO FINALIZADO! O grande campeão é ${championNick}!`, 'system');
                    tournamentActive = false;
                    updateRoomState();
                    return;
                }
            }

            let match = round[tournamentData.currentMatch];
            activeWhite = match.p1;
            activeBlack = match.p2;

            game.reset();
            updateRoomState();

            let p1Nick = userNicks[activeWhite];
            let p2Nick = userNicks[activeBlack];
            addChatMessage('', `⚔️ Partida do Torneio: ${p1Nick} (Brancas) vs ${p2Nick} (Pretas)`, 'system');
        }

        function advanceTournamentWinner(matchIdx, winnerId) {
            let rIdx = tournamentData.currentRound;
            tournamentData.rounds[rIdx][matchIdx].winner = winnerId;

            if (rIdx + 1 < tournamentData.rounds.length) {
                let nextMatchIdx = Math.floor(matchIdx / 2);
                let isP1 = (matchIdx % 2 === 0);
                if (isP1) tournamentData.rounds[rIdx + 1][nextMatchIdx].p1 = winnerId;
                else tournamentData.rounds[rIdx + 1][nextMatchIdx].p2 = winnerId;
            }
        }

        function handleHostReceivedData(c, data) {
            if (data.type === 'join') {
                connections[c.peer] = c;
                userNicks[c.peer] = data.nick;
                initPlayerScore(c.peer);

                if (!tournamentActive) {
                    if (!activeWhite) activeWhite = c.peer;
                    else if (!activeBlack) activeBlack = c.peer;
                    else spectatorQueue.push(c.peer);
                } else {
                    spectatorQueue.push(c.peer);
                }

                updateRoomState();
                addChatMessage('', `${data.nick} entrou na sala.`, 'system');
                broadcast({ type: 'sys_msg', text: `${data.nick} entrou na sala.` }, c.peer);

            } else if (data.type === 'chat') {
                addChatMessage(data.nick, data.text);
                broadcast(data, c.peer);

            } else if (data.type === 'move') {
                handleGameMove(c.peer, data.move);

            } else if (data.type === 'resign') {
                handleResignation(data.role);
            }
        }

        function registerScoreResult(winnerId, loserId, isDraw = false) {
            if (isDraw) {
                if (winnerId) { initPlayerScore(winnerId); scores[winnerId].e++; scores[winnerId].pts += 0.5; }
                if (loserId) { initPlayerScore(loserId); scores[loserId].e++; scores[loserId].pts += 0.5; }
            } else {
                if (winnerId) { initPlayerScore(winnerId); scores[winnerId].v++; scores[winnerId].pts += 1.0; }
                if (loserId) { initPlayerScore(loserId); scores[loserId].d++; }
            }
        }

        function handleGameMove(peerId, move) {
            let res = game.move(move);
            if (!res) return;

            board.position(game.fen());
            updateStatus();
            
            if (peerId !== myPeerId) {
                tocarSomMovimento();
            }

            broadcast({ type: 'move', move: move, fen: game.fen() }, peerId);

            if (game.in_checkmate()) {
                let winnerRole = game.turn() === 'w' ? 'b' : 'w';
                let winnerId = winnerRole === 'w' ? activeWhite : activeBlack;
                let loserId = winnerRole === 'w' ? activeBlack : activeWhite;
                let winnerNick = userNicks[winnerId];

                registerScoreResult(winnerId, loserId, false);
                addChatMessage('', `Xeque-mate! ${winnerNick} venceu a partida.`, 'system');
                broadcast({ type: 'sys_msg', text: `Xeque-mate! ${winnerNick} venceu a partida.` });

                setTimeout(() => finishMatch(winnerId), 2500);

            } else if (game.in_draw()) {
                registerScoreResult(activeWhite, activeBlack, true);
                addChatMessage('', `Empate! Partida finalizada com 0.5 ponto para cada.`, 'system');
                broadcast({ type: 'sys_msg', text: `Empate! Partida finalizada com 0.5 ponto para cada.` });
                
                setTimeout(() => {
                    if (tournamentActive) finishMatch(activeWhite);
                    else { game.reset(); updateRoomState(); }
                }, 2500);
            }
        }

        function handleResignation(loserRole) {
            let winnerRole = loserRole === 'w' ? 'b' : 'w';
            let loserNick = userNicks[loserRole === 'w' ? activeWhite : activeBlack];
            let winnerId = winnerRole === 'w' ? activeWhite : activeBlack;
            let loserId = loserRole === 'w' ? activeBlack : activeWhite;

            registerScoreResult(winnerId, loserId, false);
            addChatMessage('', `${loserNick} desistiu da partida!`, 'system');
            broadcast({ type: 'sys_msg', text: `${loserNick} desistiu da partida!` });

            finishMatch(winnerId);
        }

        function finishMatch(winnerId) {
            if (tournamentActive) {
                advanceTournamentWinner(tournamentData.currentMatch, winnerId);
                setupNextTournamentMatch();
            } else {
                let loserId = (winnerId === activeWhite) ? activeBlack : activeWhite;
                if (loserId) spectatorQueue.push(loserId);

                activeWhite = winnerId;
                activeBlack = spectatorQueue.length > 0 ? spectatorQueue.shift() : null;
                game.reset();
                updateRoomState();
            }
        }

        function handleUserDisconnect(peerId) {
            delete connections[peerId];
            let disconnectedNick = userNicks[peerId] || 'Um participante';
            delete userNicks[peerId];

            spectatorQueue = spectatorQueue.filter(id => id !== peerId);

            if (tournamentActive) {
                if (activeWhite === peerId && activeBlack) finishMatch(activeBlack);
                else if (activeBlack === peerId && activeWhite) finishMatch(activeWhite);
            } else {
                if (activeWhite === peerId) {
                    activeWhite = spectatorQueue.length > 0 ? spectatorQueue.shift() : null;
                    game.reset();
                } else if (activeBlack === peerId) {
                    activeBlack = spectatorQueue.length > 0 ? spectatorQueue.shift() : null;
                    game.reset();
                }
            }

            updateRoomState();
            addChatMessage('', `${disconnectedNick} saiu da sala.`, 'system');
            broadcast({ type: 'sys_msg', text: `${disconnectedNick} saiu da sala.` });
        }

        function updateRoomState() {
            let userList = getRoomUserList();
            
            if (isHost) {
                if (activeWhite === myPeerId) myRole = 'w';
                else if (activeBlack === myPeerId) myRole = 'b';
                else myRole = 'spectator';
                
                let orientation = (myRole === 'b') ? 'black' : 'white';
                initBoard(orientation);
                setControlsState(true);
                renderUserList(userList);
                renderScoreTable();
                renderBracketDisplay();
            }

            Object.keys(connections).forEach(id => {
                let role = 'spectator';
                if (id === activeWhite) role = 'w';
                else if (id === activeBlack) role = 'b';

                connections[id].send({
                    type: 'room_state',
                    role: role,
                    fen: game.fen(),
                    users: userList,
                    scores: scores,
                    userNicks: userNicks,
                    tournamentActive: tournamentActive,
                    tournamentData: tournamentData
                });
            });
        }

        function joinOnlineRoom() {
            let roomId = sanitizeRoomCode(document.getElementById('joinRoomIdInput').value.trim());
            if (!roomId) { alert('Digite o código da sala!'); return; }

            mode = 'online';
            isCpuMode = false;
            isHost = false;
            myNick = getNick();
            game.reset();
            resetPeer();

            document.getElementById('chatMessages').innerHTML = '';
            peer = new Peer();

            peer.on('open', (id) => {
                myPeerId = id;
                hostConn = peer.connect(roomId);

                hostConn.on('open', () => hostConn.send({ type: 'join', nick: myNick }));
                hostConn.on('data', (data) => handleClientReceivedData(data));
                hostConn.on('close', () => {
                    setControlsState(false);
                    addChatMessage('', 'Conexão perdida com a sala.', 'system');
                });
            });

            peer.on('error', () => { alert('Erro ao conectar.'); startOffline('local'); });
        }

        function handleClientReceivedData(data) {
            if (data.type === 'room_state') {
                myRole = data.role;
                scores = data.scores || {};
                userNicks = data.userNicks || {};
                tournamentActive = data.tournamentActive;
                tournamentData = data.tournamentData;

                let orientation = (myRole === 'b') ? 'black' : 'white';
                game.load(data.fen);
                initBoard(orientation);
                setControlsState(true);
                renderUserList(data.users);
                renderScoreTable();
                renderBracketDisplay();

                let roleLabel = myRole === 'w' ? 'Jogador (Brancas)' : (myRole === 'b' ? 'Jogador (Pretas)' : 'Espectador');
                document.getElementById('roomDisplay').style.display = 'block';
                document.getElementById('roomDisplay').innerHTML = `✅ <strong>SALA CONECTADA</strong> | Papel: <u>${roleLabel}</u>`;

            } else if (data.type === 'move') {
                game.move(data.move);
                board.position(game.fen());
                updateStatus();
                tocarSomMovimento();

            } else if (data.type === 'chat') {
                addChatMessage(data.nick, data.text);

            } else if (data.type === 'sys_msg') {
                addChatMessage('', data.text, 'system');

            } else if (data.type === 'error') {
                alert(data.text);
            }
        }

        startOffline('local');
    </script>
</body>
</html>
